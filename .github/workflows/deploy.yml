name: Deploy demo
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiga-family/actions/setup-variables@a4bf1550ffd2659e8cf5584ed793f489aebd4854 # v2.8.0
      - uses: taiga-family/actions/setup-node@a4bf1550ffd2659e8cf5584ed793f489aebd4854 # v2.8.0
      - run: npm run build:demo
      - uses: taiga-family/actions/deploy-github-pages@a4bf1550ffd2659e8cf5584ed793f489aebd4854 # v2.8.0
        with:
          token: ${{ secrets.TAIGA_FAMILY_BOT_PAT }}
          folder: dist/apps/demo/browser

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
