name: Deploy demo
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiga-family/actions/setup-variables@ed4e7ce7c012436a5f2b02d2b5a7aa86581db73a # v2.14.0
      - uses: taiga-family/actions/setup-node@ed4e7ce7c012436a5f2b02d2b5a7aa86581db73a # v2.14.0
      - run: npm run build:demo
      - uses: taiga-family/actions/deploy-github-pages@ed4e7ce7c012436a5f2b02d2b5a7aa86581db73a # v2.14.0
        with:
          token: ${{ secrets.TAIGA_FAMILY_BOT_PAT }}
          folder: dist/apps/demo/browser

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
